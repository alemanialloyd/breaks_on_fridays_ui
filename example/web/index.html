<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Documentation for breaks_on_fridays_ui: learn the BoF widgets, explore interactive previews, and copy Dart examples for your Flutter app.">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:title" content="BoF Documentation">
  <meta property="og:description" content="Styled Flutter widgets, interactive previews, and practical Dart examples for breaks_on_fridays_ui.">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="BoF Docs">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <title>BoF Documentation</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; background: #fff; }
    #app-loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 14px;
      background: #fff;
      color: #18181b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }
    #app-loading img { width: 44px; height: 44px; }
    #app-loading h1 { margin: 4px 0 0; font-size: 20px; font-weight: 600; letter-spacing: -.5px; }
    #app-loading p { margin: 0; color: #71717a; font-size: 14px; }
    noscript { display: block; padding: 32px; font-family: sans-serif; }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-live="polite">
    <img src="favicon.svg" alt="">
    <h1>BoF Documentation</h1>
    <p>Loading widgets and examples…</p>
  </div>
  <noscript>
    <style>#app-loading { display: none; }</style>
    Enable JavaScript to explore the BoF documentation and interactive examples.
  </noscript>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('app-loading')?.remove();
    }, { once: true });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
